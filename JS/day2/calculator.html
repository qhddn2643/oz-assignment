<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./calculator.js"></script>
    <title>사칙연산 계산기</title>
</head>
<body>
    <h1>콘솔창 계산기 프로그램</h1>

    <h2>Windows의 경우</h2>
    <hr>
    <p>1. Ctrl + Shift + J 키를 눌러 콘솔창을 여세요.</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>

    <h2>macOS의 경우</h2>
    <hr>
    <p>1. Command + Option + J 키를 눌러 콘솔창을 여세요.</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>
</body>
</html>
